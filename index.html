<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#d2432c">
<title>Mapa Mega Moda · Região da 44</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--panel:#fffdf9;--ink:#1f1a17;--mut:#7a6f66;--line:#e4dacd;--acc:#d2432c;--acc2:#1d5c63;--corr:#efe6da;--store:#fff;--me:#1a73e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 12px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
h1{font-size:15px;margin:0;line-height:1.1}
h1 small{display:block;font-weight:600;color:var(--mut);font-size:11px}
.pill{font:inherit;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff;color:var(--mut);white-space:nowrap;cursor:pointer;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.pill.on{color:#fff;background:var(--me);border-color:var(--me)}
#inst{display:none;background:var(--ink);color:#fff;border-color:var(--ink)}
.search{margin-top:8px}
.search input{width:100%;font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;outline:none}
.search input:focus{border-color:var(--acc2)}
.chips,nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar,nav::-webkit-scrollbar{display:none}
.chips{padding:8px 0 2px}
.chip{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
nav{padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{flex:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--mut);border:1px solid transparent}
.tab.on{color:var(--ink);background:#fff;border-color:var(--line)}
.tab b{font-size:10px;background:var(--acc);color:#fff;border-radius:999px;padding:1px 5px;margin-left:4px}
.sep{width:1px;background:var(--line);flex:none;margin:2px}
#mapwrap{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden;background:radial-gradient(circle at 1px 1px,#e2d7c9 1px,transparent 0) 0 0/18px 18px}
svg#map{width:100%;height:100%;display:block;user-select:none}
.fab{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.fab button,.fabl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:18px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.fabl{position:absolute;left:10px;top:10px}
.fabl button{width:auto;padding:0 12px;font-size:12px}
.fabl button.on{background:var(--me);color:#fff;border-color:var(--me)}
.hint{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:7px 12px;border-radius:10px;display:none;max-width:90%;text-align:center}
#sheet{background:var(--panel);border-top:1px solid var(--line);max-height:38vh;display:flex;flex-direction:column;box-shadow:0 -6px 20px rgba(0,0,0,.06);transition:max-height .2s}
#sheet.min{max-height:44px}
.grab{position:relative;padding:8px 12px 6px;display:flex;align-items:center;gap:8px;cursor:pointer}
.grab:before{content:"";width:34px;height:4px;border-radius:4px;background:var(--line);position:absolute;left:50%;top:3px;transform:translateX(-50%)}
.grab .t{font-size:13px;font-weight:800}
.grab .m{font-size:12px;color:var(--mut);margin-left:auto}
.body{overflow:auto;padding:0 12px 14px}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item .dot{width:10px;height:10px;border-radius:3px;flex:none}
.item .n{font-weight:700;font-size:14px}
.item .l{font-size:12px;color:var(--mut)}
.item .go{margin-left:auto;font-size:11px;font-weight:800;color:var(--acc2);white-space:nowrap;text-decoration:none}
.star{color:#e2a400}
.card h2{font-size:18px;margin:2px 0}
.card .loc{font-size:13px;color:var(--mut);font-weight:600}
.promo{margin:8px 0;padding:8px 10px;border-radius:10px;background:#fff4d6;border:1px solid #f1d58a;font-size:13px;font-weight:700}
.desc{font-size:13px;line-height:1.45;margin:6px 0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f1e9df}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btn{font:inherit;font-size:13px;font-weight:800;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.b{background:var(--me);border-color:var(--me);color:#fff}
.btn.w{background:#1faa59;border-color:#1faa59;color:#fff}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:13.5px;line-height:1.45}
ol.steps li{margin:4px 0}
.note{font-size:11.5px;color:var(--mut);line-height:1.4;margin-top:10px}
.note a{color:var(--acc2);font-weight:700}
.empty{font-size:13px;color:var(--mut);padding:10px 0}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes pulse{0%{r:7;opacity:.5}100%{r:22;opacity:0}}
.route{animation:dash .8s linear infinite}.pulse{animation:pulse 1.6s ease-out infinite}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">44</div>
    <h1>Mapa Mega Moda<small id="sub">Região da 44 · Goiânia</small></h1>
    <span style="margin-left:auto;display:flex;gap:6px">
      <button class="pill" id="inst">⬇ Instalar</button>
      <button class="pill" id="gps">📡 Ativar GPS</button>
    </span>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Loja, produto, via ou nº (ex.: biquíni, Via Tulipa, 1082)" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
</header>
<nav id="tabs"></nav>
<div id="mapwrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="fabl"><button id="mark">📍 Marcar minha posição</button></div>
  <div class="fab"><button id="zin">+</button><button id="zout">−</button><button id="zfit" style="font-size:14px">⤢</button></div>
  <div class="hint" id="hint"></div>
</div>
<section id="sheet">
  <div class="grab" id="grab"><span class="t" id="st">Lojas</span><span class="m" id="sm"></span></div>
  <div class="body" id="sb"></div>
</section>
<script src="config.js"></script>
<script src="lojas-data.js"></script>
<script src="core.js"></script>
<script src="camera.js"></script>
<script>
"use strict";
const {BUILD,BORDER,FLOORS,FLEVEL,SEGS,SEGCOLOR,esc} = MM;
const $ = id => document.getElementById(id);
let STORES = [], G = {}, INFO = {src:"embutido",date:""};
const st = {g:null,q:"",seg:null,sel:null,me:null,marking:false,gps:null,gpsB:null,auto:false};
try{ const m=JSON.parse(localStorage.getItem("mm_me")||"null"); if(m&&m.x!=null) st.me=m; }catch(e){}
let match = () => true;
const filtering = () => !!(st.seg || st.q.trim());
const pz = MM.panZoom($("map"), $("mapwrap"), {
  tap(target, p){
    if (st.marking){ markAt(p); return; }
    const el = target.closest && target.closest("[data-id]");
    if (el) selectStore(+el.getAttribute("data-id"), false);
  }
});

/* ---------- chips e abas ---------- */
function renderChips(){
  const c={}; STORES.forEach(s=>s.cats.forEach(x=>c[x]=(c[x]||0)+1));
  $("chips").innerHTML = SEGS.filter(([x])=>c[x]).map(([x,col])=>`<span class="chip ${st.seg===x?"on":""}" data-seg="${esc(x)}"><i style="background:${col}"></i>${esc(x)}</span>`).join("");
}
$("chips").onclick = e => { const c=e.target.closest(".chip"); if(!c) return; st.seg = st.seg===c.dataset.seg?null:c.dataset.seg; st.sel=null; refresh(true); };
function renderTabs(){
  let h="", last=null;
  for (const k of MM.groupOrder(G)){
    const g=G[k]; if (last && last!==g.b) h+=`<span class="sep"></span>`;
    const n = filtering() ? g.stores.filter(match).length : 0;
    h+=`<span class="tab ${st.g===k?"on":""}" data-g="${k}">${BUILD[g.b].short} · ${FLOORS[g.f].split(" ·")[0]}${n?`<b>${n}</b>`:""}</span>`; last=g.b;
  }
  $("tabs").innerHTML=h;
}
$("tabs").onclick = e => { const t=e.target.closest(".tab"); if(t) showGroup(t.dataset.g,true); };

/* ---------- mapa ---------- */
function startPoint(g){ return st.me && st.me.g===g.key ? st.me : g.entry; }
function draw(){
  const g=G[st.g]; if(!g) return;
  let path=null;
  if (st.sel!=null && STORES[st.sel].g===st.g) path = MM.walk(g, startPoint(g), STORES[st.sel], "").pts;
  $("map").innerHTML = MM.draw(g,{filter:filtering()?match:null, sel:st.sel, path, me: st.me&&st.me.g===st.g?st.me:null});
}
function fit(){ const g=G[st.g]; if(g) pz.fit(MM.bounds(g)); }
$("zin").onclick=()=>pz.zoom(1.4); $("zout").onclick=()=>pz.zoom(1/1.4); $("zfit").onclick=fit;
function toast(t,ms){ const h=$("hint"); h.textContent=t; h.style.display="block"; clearTimeout(toast.t); if(ms) toast.t=setTimeout(()=>{ if(!st.marking) h.style.display="none"; },ms); }

/* ---------- posição ---------- */
function saveMe(){ try{ localStorage.setItem("mm_me",JSON.stringify(st.me)); }catch(e){} }
function markAt(p){ const g=G[st.g], q=MM.nearest(g,p); st.me={g:st.g,x:q.x,y:q.y,how:"mapa"}; saveMe(); setMarking(false); refresh(); }
function meAtStore(id){ const s=STORES[id]; st.me={g:s.g,x:s.door.x,y:s.door.y,how:"loja"}; saveMe(); refresh(); toast("📍 Posição marcada em "+s.n,2500); }
function setMarking(on){ st.marking=on; $("mark").classList.toggle("on",on); $("mark").textContent=on?"✕ Cancelar":"📍 Marcar minha posição"; if(on) toast("Toque no corredor onde você está"); else $("hint").style.display="none"; }
$("mark").onclick=()=>setMarking(!st.marking);
function applyHash(){
  const h=location.hash.slice(1); if(!h.startsWith("qr-")) return;
  const r=MM.resolveQR(h,G); if(!r) return;
  st.me={g:r.g,x:r.x,y:r.y,how:"qr"}; saveMe(); showGroup(r.g,false); pz.center(r.x,r.y,380); renderSheet();
  toast("📍 Você está em: "+r.label,4000); MM.track("qr",{ponto:h});
}
window.addEventListener("hashchange",applyHash);

/* ---------- passo a passo ---------- */
function stepsFor(s){
  const g=G[s.g], B=BUILD[s.b], me = st.me && G[st.me.g] ? st.me : null, steps=[];
  const floorMove = from => {
    if (s.f===from) return;
    if (s.f==="G3"||from==="G3") steps.push(`Vá até a área <b>${FLOORS[s.f]}</b> (siga as placas “G3”).`);
    else steps.push(`Pegue a escada rolante/elevador e ${FLEVEL[s.f]>FLEVEL[from]?"suba":"desça"} para o <b>${FLOORS[s.f]}</b>.`);
  };
  if (!me){
    steps.push(`Vá até o <b>${B.name}</b> (${esc(B.addr)}).`); floorMove("T");
    steps.push(...MM.walk(g,g.entry,s,"Da entrada,").steps);
    return {steps, warn:"Marque sua posição (📍, QR Code do corredor ou “Estou nesta loja”) para a rota sair de onde você está."};
  }
  const mg=G[me.g];
  if (mg.b!==s.b){ steps.push(`Saia do <b>${BUILD[mg.b].name}</b> e vá ao <b>${B.name}</b> — os prédios do complexo ficam lado a lado.`); floorMove("T"); steps.push(...MM.walk(g,g.entry,s,"Da entrada,").steps); }
  else if (me.g!==s.g){ steps.push(`Vá até a escada/elevador mais próximo.`); floorMove(mg.f); steps.push(...MM.walk(g,g.entry,s,"Saindo da escada,").steps); }
  else steps.push(...MM.walk(g,me,s,"De onde você está,").steps);
  return {steps};
}

/* ---------- modo câmera ---------- */
function openCam(s){
  const g=G[s.g], same = st.me && st.me.g===s.g;
  if (st.g!==s.g) showGroup(s.g,false);
  MM.track("cam",{loja:s.s});
  MM.cam.open({ g, store:s, from: same ? st.me : g.entry,
    move(p){ st.me={g:g.key,x:p.x,y:p.y,how:"cam"}; saveMe(); },
    qr(code){ const r=MM.resolveQR(code,G); if(!r||r.g!==g.key) return null; MM.track("qr",{ponto:code}); return {x:r.x,y:r.y}; },
    close(){ refresh(); } });
  if (!same) setTimeout(()=>{ const m=document.getElementById("cmsg"); if(m){ m.textContent=`Rota a partir da entrada do ${FLOORS[g.f].split(" ·")[0]} do ${BUILD[g.b].short}. Leia o QR Code de um corredor para começar de onde você está.`; m.style.display="block"; } },300);
}

/* ---------- painel inferior ---------- */
function showGroup(k,doFit){ st.g=k; renderTabs(); draw(); if(doFit) fit(); const g=G[k]; $("sub").textContent=`${BUILD[g.b].name} · ${FLOORS[g.f]}`; }
function selectStore(id,center){
  st.sel=id; const s=STORES[id];
  if (st.g!==s.g) showGroup(s.g,false);
  draw(); renderSheet(); if(center!==false) pz.center(s.door.x,s.door.y,340);
  $("sheet").classList.remove("min"); MM.track("loja",{loja:s.s});
}
const gmaps = a => "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(a);
const wa = n => { let d=String(n).replace(/\D/g,""); if(d.length<=11) d="55"+d; return "https://wa.me/"+d; };
const ig = v => /^https?:/.test(v) ? v : "https://www.instagram.com/"+String(v).replace(/^@/,"")+"/";
function renderSheet(){
  const sb=$("sb");
  if (st.sel!=null){
    const s=STORES[st.sel], B=BUILD[s.b], {steps,warn}=stepsFor(s);
    $("st").textContent="Rota até a loja"; $("sm").innerHTML=`<span id="back">← lista</span>`;
    sb.innerHTML=`<div class="card">
      <h2>${s.dest?'<span class="star">★</span> ':""}${esc(s.n)}</h2>
      <div class="loc">${esc(B.name)} · ${FLOORS[s.f]} · ${esc(s.cor)}${s.num?` · Loja ${esc(s.num)}`:""}</div>
      ${s.promo?`<div class="promo">🏷️ ${esc(s.promo)}</div>`:""}
      ${s.desc?`<div class="desc">${esc(s.desc)}</div>`:""}
      <div class="tags">${s.cats.map(c=>`<span class="tag" style="border-left:3px solid ${SEGCOLOR[c]||"#999"}">${esc(c)}</span>`).join("")}</div>
      <ol class="steps">${steps.map(t=>`<li>${t}</li>`).join("")}</ol>
      ${warn?`<div class="note">⚠️ ${warn}</div>`:""}
      <div class="btns">
        <button class="btn b" id="camb">📷 Ver caminho na câmera</button>
        <button class="btn" id="here">📍 Estou nesta loja</button>
        ${s.whats?`<a class="btn w" id="wa" href="${wa(s.whats)}" target="_blank" rel="noopener">WhatsApp ↗</a>`:""}
        ${s.insta?`<a class="btn" href="${esc(ig(s.insta))}" target="_blank" rel="noopener">Instagram ↗</a>`:""}
        <a class="btn" href="https://www.megamoda.com.br/produto/${encodeURIComponent(s.s)}/" target="_blank" rel="noopener">Ver no site ↗</a>
        <a class="btn" href="${gmaps(B.name+", "+B.addr)}" target="_blank" rel="noopener">Chegar ao prédio ↗</a>
      </div>
      <div class="note">Endereço oficial: ${esc(s.loc)}</div></div>`;
    sb.scrollTop=0;
    $("here").onclick=()=>meAtStore(s.id);
    $("camb").onclick=()=>openCam(s);
    const w=$("wa"); if(w) w.onclick=()=>MM.track("whats",{loja:s.s});
    $("back").onclick=e=>{ e.stopPropagation(); st.sel=null; refresh(); };
    return;
  }
  const list=STORES.filter(match).sort((a,b)=>(b.dest-a.dest));
  const here=list.filter(s=>s.g===st.g), ordered=filtering()?[...here,...list.filter(s=>s.g!==st.g)]:here;
  $("st").textContent=filtering()?`${list.length} loja${list.length!==1?"s":""} encontrada${list.length!==1?"s":""}`:"Lojas neste piso";
  $("sm").textContent=filtering()?`${here.length} neste piso`:`${STORES.length} lojas no total`;
  const g=G[st.g];
  const foot=`<div class="note">Dados de megamoda.com.br${INFO.date?` (${INFO.date})`:""}${INFO.src==="online"?" · atualizados pelos lojistas":INFO.src==="offline"?" · modo offline":""}. ${g&&g.custom?"Planta desenhada sobre o mapa do prédio.":"Planta esquemática: corredores e ordem das lojas seguem os endereços oficiais; distâncias estimadas."}${MM.online()?` · <a href="admin.html">Painel do lojista</a>`:""}</div>`;
  if(!ordered.length){ sb.innerHTML=`<div class="empty">Nada encontrado. Tente outro nome, produto (biquíni, jeans, tênis…) ou número de loja.</div>`+foot; return; }
  sb.innerHTML=ordered.slice(0,80).map(s=>`<div class="item" data-id="${s.id}"><span class="dot" style="background:${SEGCOLOR[s.prim]||"#999"}"></span>
    <div><div class="n">${s.dest?'<span class="star">★</span> ':""}${esc(s.n)}</div><div class="l">${BUILD[s.b].short} · ${FLOORS[s.f].split(" ·")[0]} · ${esc(s.cor)}${s.num?` · ${esc(s.num)}`:""}${s.promo?" · 🏷️":""}</div></div><span class="go">Rota →</span></div>`).join("")
    +(ordered.length>80?`<div class="empty">+${ordered.length-80} lojas — refine a busca.</div>`:"")+foot;
}
$("sb").onclick=e=>{ const it=e.target.closest(".item[data-id]"); if(it) selectStore(+it.dataset.id); };
$("grab").onclick=e=>{ if(e.target.id!=="back") $("sheet").classList.toggle("min"); };
let qt,tt; $("q").oninput=e=>{ clearTimeout(qt); clearTimeout(tt); const v=e.target.value;
  qt=setTimeout(()=>{ st.q=v; st.sel=null; refresh(true); },150);
  tt=setTimeout(()=>{ const t=v.trim(); if(t.length>=2) MM.track("busca",{termo:MM.norm(t),n:STORES.filter(match).length}); },1800); };
function refresh(jump){
  match = MM.matcher(STORES, st.q, st.seg);
  renderChips(); renderTabs();
  if (jump && filtering() && !G[st.g].stores.some(match)){ const f=STORES.find(match); if(f){ showGroup(f.g,true); } }
  draw(); renderSheet();
}

/* ---------- GPS ---------- */
try{ const c=JSON.parse(localStorage.getItem("mm_cal")||"{}"); for(const k in c) if(BUILD[k]) Object.assign(BUILD[k],c[k],{cal:true}); }catch(e){}
$("gps").onclick=()=>{
  if (st.gps){ gpsPanel(); return; }
  if (!("geolocation" in navigator)) return gpsFail("Este navegador não tem GPS.");
  $("gps").textContent="📡 Procurando…";
  try{ navigator.geolocation.watchPosition(p=>{
    st.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    let best=null; for(const k of BORDER){ const d=MM.hav(st.gps.lat,st.gps.lng,BUILD[k].lat,BUILD[k].lng); if(!best||d<best.d) best={k,d}; }
    st.gpsB=best; const inside=best.d<120+Math.min(st.gps.acc,80);
    $("gps").classList.add("on");
    $("gps").textContent=inside?`📍 No ${BUILD[best.k].short} (±${Math.round(st.gps.acc)} m)`:`📍 ${best.d>1000?(best.d/1000).toFixed(1)+" km":Math.round(best.d)+" m"} do ${BUILD[best.k].short}`;
    if (inside && !st.auto){ st.auto=true; const k=G[best.k+"|T"]?best.k+"|T":Object.keys(G).find(x=>x.startsWith(best.k)); if(k && G[st.g].b!==best.k) showGroup(k,true); }
  }, err=>gpsFail(err.code===1?"Permissão de localização negada ou bloqueada nesta visualização.":"Não foi possível obter o GPS."), {enableHighAccuracy:true,maximumAge:5000,timeout:20000}); }
  catch(e){ gpsFail("GPS indisponível nesta visualização."); }
};
function gpsFail(msg){
  $("gps").classList.remove("on"); $("gps").textContent="📡 GPS indisponível"; st.sel=null; $("st").textContent="GPS"; $("sm").textContent="";
  $("sb").innerHTML=`<div class="card"><div class="note" style="font-size:13px">${esc(msg)}<br><br>O GPS diz em qual prédio você está. Dentro dele, a posição exata vem do <b>QR Code do corredor</b>, de <b>📍 Marcar minha posição</b> ou de <b>“Estou nesta loja”</b>.<br><br>Dentro do Claude a localização é bloqueada; no site publicado (HTTPS) ela funciona.</div></div>`;
  $("sheet").classList.remove("min");
}
function gpsPanel(){
  st.sel=null; $("st").textContent="Sua localização (GPS)"; $("sm").textContent="";
  $("sb").innerHTML=`<div class="card"><div class="loc">Precisão: ±${Math.round(st.gps.acc)} m · ${st.gps.lat.toFixed(5)}, ${st.gps.lng.toFixed(5)}</div>
   ${BORDER.map(k=>{ const B=BUILD[k], d=MM.hav(st.gps.lat,st.gps.lng,B.lat,B.lng); return `<div class="item" style="cursor:default"><span class="dot" style="background:var(--acc2)"></span><div><div class="n">${B.name}</div><div class="l">${d>1000?(d/1000).toFixed(1)+" km":Math.round(d)+" m"} ${B.cal?"(calibrado)":"(coordenada aproximada)"}</div></div><a class="go" href="${gmaps(B.name+", "+B.addr)}" target="_blank" rel="noopener">Rota ↗</a></div>`; }).join("")}
   <div class="btns"><button class="btn" id="cal">🎯 Estou na entrada do ${BUILD[G[st.g].b].short}</button></div>
   <div class="note">“Estou na entrada” grava o GPS atual como a posição do prédio aberto no mapa, só neste aparelho. O administrador pode gravar para todos no painel.</div></div>`;
  $("cal").onclick=()=>{ const g=G[st.g], k=g.b; Object.assign(BUILD[k],{lat:st.gps.lat,lng:st.gps.lng,cal:true});
    try{ const c=JSON.parse(localStorage.getItem("mm_cal")||"{}"); c[k]={lat:st.gps.lat,lng:st.gps.lng}; localStorage.setItem("mm_cal",JSON.stringify(c)); }catch(e){}
    const t=G[k+"|T"]||g; st.me={g:t.key,x:t.entry.x,y:t.entry.y,how:"entrada"}; saveMe(); gpsPanel(); draw(); };
  $("sheet").classList.remove("min");
}

/* ---------- instalar (PWA) ---------- */
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; $("inst").style.display="inline-block"; });
$("inst").onclick=async()=>{ if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; $("inst").style.display="none"; };
if ("serviceWorker" in navigator && location.protocol==="https:" && window.top===window) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- início ---------- */
function boot(data){
  INFO={src:data.src,date:data.date};
  if (data.layouts && data.layouts.predios) for(const k in data.layouts.predios) if(BUILD[k] && !BUILD[k].cal) Object.assign(BUILD[k],data.layouts.predios[k]);
  const b=MM.build(data.stores,data.layouts); STORES=b.stores; G=b.G;
  if (st.me && !G[st.me.g]) st.me=null;
  st.sel=null; st.g = st.me ? st.me.g : (G["shopping|T"]?"shopping|T":MM.groupOrder(G)[0]);
  match=MM.matcher(STORES,st.q,st.seg);
  renderChips(); renderSheet(); showGroup(st.g,false); requestAnimationFrame(()=>{ fit(); applyHash(); });
}
window.addEventListener("resize",fit);
boot({stores:MM.embedded(),layouts:{},src:"embutido",date:window.MM_DATE||""});
MM.load().then(d=>{ if(d.src!=="embutido"||Object.keys(d.layouts).length) boot(d); MM.track("abrir"); });
</script>
</body>
