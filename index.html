<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#16163f">
<script>try{var t=JSON.parse(localStorage.getItem("mm_theme")||"null");if(!t)t="light";document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Mapa Mega Moda · Região da 44</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,700&display=swap" rel="stylesheet">
<style>
/* Catálogo de atacado: cada loja é uma REF; o mapa é a página onde ela é apontada */
:root{--bg:#f6f5fa;--panel:#fff;--panel2:#efeef7;--ink:#17163a;--mut:#58567c;--line:#dcdaea;--acc:#cc3366;--acc-ink:#fff;--acc2:#2b2860;--corr:#e4e2f2;--store:#fff;--me:#1a73e8;--sel:#ffe4ee;--vaga:#fff1c2;--dest:#fff7e0;--halo:#fff;--chip:#eeedf6;--navy:#2b2860;--navy2:#16163f;--gold:#ffc233;--gold-ink:#7a5200;--ok:#0b7a3b;--warn-bg:#fff4d6;--warn-line:#e4b73a;--shadow:0 4px 12px -4px rgba(0,0,0,.22);--lst:#e65100;--glass:#fff;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--cond:72%;--r:12px}
[data-theme=dark]{--bg:#0f0f26;--panel:#17173a;--panel2:#1d1d45;--ink:#f1f0fb;--mut:#b0aed4;--line:#2e2d5c;--acc:#ff5c93;--acc-ink:#1a0d11;--acc2:#a9a4ff;--corr:#2a2952;--store:#24234c;--me:#5aa0ff;--sel:#4d2650;--vaga:#4d3f10;--dest:#2f2c4d;--halo:#14132e;--chip:#23234c;--gold-ink:#ffc233;--ok:#3ccf7a;--warn-bg:#33290c;--warn-line:#8a6a12;--shadow:0 8px 22px -8px rgba(0,0,0,.7);--lst:#ffa040;--glass:#17173a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;caret-color:var(--acc)}
body{display:flex;flex-direction:column;overflow:hidden;height:100dvh}
::selection{background:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.dist,.ref b,.pvd,.tab,.mtr{font-variant-numeric:tabular-nums lining-nums}
/* ---------- cabeçalho: faixa marinho com o nome em corpo de catálogo ---------- */
header{padding:10px 12px;background:var(--navy2);color:#fff;flex:none;border-bottom:2px solid var(--gold)}
.top{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;padding:4px;object-fit:contain;flex:none}
.logo.fb{display:grid;place-items:center;background:var(--acc);color:#fff;font-weight:900;font-size:16px;padding:0}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:20px;line-height:1;font-weight:850;font-stretch:var(--cond);text-transform:uppercase;letter-spacing:.01em}
.ttl b span{color:var(--gold);margin-left:5px}
.ttl small{display:block;font-size:12.5px;color:#d9d7f2;line-height:1.3;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;flex:none;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.ibtn:hover{background:rgba(255,255,255,.1)}
.ibtn.on{background:var(--gold);border-color:var(--gold);color:var(--navy2)}
#inst{display:none}
#th .sun{display:none}[data-theme=dark] #th .sun{display:block}[data-theme=dark] #th .moon{display:none}
/* ---------- abas de prédio · andar: sumário do catálogo ---------- */
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:13.5px;font-weight:700;font-stretch:85%;padding:12px 10px 10px;color:var(--mut);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.tab b{font-size:11px;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:1px 6px;margin-left:6px;font-weight:800}
.tab .lb{font-style:normal;font-size:11px;font-weight:800;background:var(--lst);color:#fff;border-radius:999px;padding:1px 6px;margin-left:6px}
.sep{width:1px;background:var(--line);flex:none;margin:10px 6px}
/* ---------- mapa ---------- */
#mapwrap{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/24px 24px,var(--bg)}
svg#map{width:100%;height:100%;display:block;user-select:none}
.fab{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.fab button{width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:var(--ink);font-size:14px;font-weight:800;display:grid;place-items:center;padding:0;transition:background .15s}
.fab button:hover{background:var(--chip)}
.fab #navb{background:var(--navy);color:#fff;margin-bottom:2px}
[data-theme=dark] .fab #navb{background:var(--acc);color:var(--acc-ink)}
.fab button.on:not(#navb){background:var(--chip);color:var(--acc)}
.fab .t3{font-stretch:var(--cond);font-size:15px;font-weight:900;letter-spacing:.02em}
.fab .rot{display:none!important}
.fabl{position:absolute;left:10px;bottom:10px}
.fabl button{height:44px;padding:0 14px 0 11px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);font-size:14px;font-weight:750;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:7px}
.fabl button .i{width:19px;height:19px;color:var(--acc)}
.fabl button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.fabl button.on .i{color:inherit}
#locb{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);display:none;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;background:var(--panel);color:var(--ink);font-size:13.5px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;cursor:pointer}
#locb i{width:10px;height:10px;border-radius:50%;background:var(--me);box-shadow:0 0 0 3px color-mix(in srgb,var(--me) 30%,transparent);flex:none}
.hint{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--navy2);color:#fff;font-size:14px;font-weight:600;padding:10px 14px;border-radius:10px;display:none;max-width:88%;text-align:center;z-index:3;box-shadow:var(--shadow);border-bottom:2px solid var(--gold)}
/* ---------- gaveta: página do catálogo ---------- */
#sheet{background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -6px 16px -10px rgba(0,0,0,.3);display:flex;flex-direction:column;flex:none;overflow:hidden;border-top:1px solid var(--line)}
#sheet.peek{height:auto}#sheet.peek .body{display:none}#sheet.mid{height:44vh}#sheet.full{height:86vh}
#sheet.cm{height:auto}#sheet.cm .grab{padding:16px 16px 2px}#sheet.cm .body{overflow:visible;flex:none;padding-bottom:14px}
.grab{padding:18px 16px 10px;display:flex;align-items:baseline;gap:10px;cursor:grab;touch-action:none;position:relative;flex:none}
.grab:before{content:"";width:36px;height:4px;border-radius:4px;background:var(--line);position:absolute;left:50%;top:7px;transform:translateX(-50%)}
.grab .t{font-size:19px;font-weight:850;font-stretch:var(--cond);flex:1;min-width:0;line-height:1.15;overflow-wrap:anywhere;letter-spacing:.005em}
.grab .m{font-size:12.5px;color:var(--mut);text-align:right;flex:none;max-width:48%;font-weight:600}
.body{overflow:auto;padding:0 16px 18px;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
h3{font-size:16px;margin:20px 0 6px;color:var(--ink);font-weight:850;font-stretch:var(--cond);letter-spacing:.005em}
/* busca e filtros */
.sq{padding:2px 16px 10px;border-top:1px solid var(--line);flex:none;background:var(--panel)}
.search{position:relative;margin-top:10px}
.search input{width:100%;height:46px;font:inherit;font-size:16px;font-weight:550;padding:0 44px;border-radius:var(--r);border:2px solid transparent;background:var(--panel);color:var(--ink);outline:none;-webkit-appearance:none;transition:border-color .15s,background .15s}
.search input::placeholder{color:var(--mut)}
.search input:focus{border-color:var(--gold)}
.search input::-webkit-search-cancel-button{display:none}
.search .si{position:absolute;left:13px;top:13px;color:var(--mut);pointer-events:none}
.search input:focus~.si,.search:focus-within .si{color:var(--acc)}
#qx{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;color:var(--mut);display:none;place-items:center;border-radius:8px}
#qx .i{width:18px;height:18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 0;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13.5px;font-weight:700;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--mut)}
.chip .i{width:17px;height:17px;color:var(--acc2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}.chip.on .i{color:inherit}
#sheet[data-v=store] .sq,#sheet[data-v=list] .sq,#sheet[data-v=me] .sq,#sheet[data-v=fac] .sq{display:none}
/* amostra de cor do segmento (cartela) */
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c,#999);flex:none;vertical-align:0}
/* REF: corredor + número do box, como a referência de uma peça */
.ref{flex:none;width:64px;display:flex;align-items:center;line-height:1}
.ref b{font-size:18px;font-weight:850;font-stretch:var(--cond);color:var(--gold-ink);letter-spacing:.01em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref.lg{width:auto;max-width:42%;padding-right:14px;margin-right:2px;border-right:1px solid var(--line);align-self:stretch}
.ref.lg b{font-size:28px}
/* índice de lojas */
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.item:hover{background:color-mix(in srgb,var(--chip) 60%,transparent)}
.item .mid{flex:1;min-width:0}
.item .n{font-weight:750;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.item .l{font-size:13px;color:var(--mut);line-height:1.35;margin-top:3px;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rt{display:flex;align-items:center;gap:10px;flex:none}
.dist{font-size:14px;font-weight:750;color:var(--ink);white-space:nowrap;font-stretch:85%}
.add{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--acc);display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s,color .15s}
.add:hover{border-color:var(--acc)}
.add .i{width:20px;height:20px}
.add.in{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.star{color:var(--gold-ink)}.star .i{width:.95em;height:.95em;vertical-align:-.08em;fill:currentColor;stroke-width:1.4}
.flag{font-size:11.5px;font-weight:800;padding:1px 6px;border-radius:4px;background:var(--warn-bg);color:var(--gold-ink)}
/* cartela de segmentos (início) */
.cart{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.cart button{display:flex;align-items:center;gap:10px;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:14.5px;font-weight:700;color:var(--ink);transition:color .15s}
.cart button:hover{color:var(--acc)}
.cart .sw{width:14px;height:14px}
.cart .c{margin-left:auto;font-size:12.5px;color:var(--mut);font-weight:650;font-variant-numeric:tabular-nums}
/* ficha da loja */
.pv{touch-action:none}
.pv1{display:flex;gap:12px;align-items:center}
.pvm{flex:1;min-width:0}.pvm h2,.card h2{font-size:24px;margin:0;line-height:1.08;font-weight:850;font-stretch:var(--cond);overflow-wrap:anywhere;letter-spacing:.005em}
.pvbox,.loc{margin-top:5px;font-size:14px;color:var(--mut);font-weight:550;line-height:1.35}
.pvx{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;flex:none;align-self:flex-start;padding:0}
.pvx .i{width:18px;height:18px}
.pv2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0 2px;font-size:13.5px}
.segs{display:inline-flex;gap:10px;flex-wrap:wrap;color:var(--ink);font-weight:650}
.segs span{display:inline-flex;align-items:center;gap:5px}
.pvd{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--ink)}.pvd .i{width:17px;height:17px;color:var(--acc)}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:800}
.bdg:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.bdg.open{color:var(--ok)}.bdg.soon{color:#b45309}.bdg.shut{color:#b4232b}
.pv3{display:flex;gap:8px;margin-top:14px}
.pv3 .btn{min-height:50px;font-size:15.5px}
.pv3 .pri{flex:1.4}.pv3 .sec{flex:1;white-space:nowrap}
.pvmore{display:flex;align-items:center;gap:4px;margin:10px auto 0;border:0;background:none;color:var(--mut);font-size:13.5px;font-weight:700;padding:6px 10px;border-radius:8px}
.pvmore:hover{color:var(--ink)}
.pvmore .i{width:16px;height:16px}
/* botões: um vocabulário só */
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{font-size:14.5px;font-weight:750;padding:0 14px;min-height:46px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center;line-height:1.2;transition:background .15s,border-color .15s,color .15s,transform .12s}
.btn:hover{border-color:var(--mut)}
.btn:active{transform:scale(.98)}
.btn .i{width:18px;height:18px}
.btn.g,.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);flex:1 1 150px}
.btn.g:hover,.btn.pri:hover{filter:brightness(1.06)}
.btn.b{background:var(--navy);border-color:var(--navy);color:#fff;flex:1 1 150px}
[data-theme=dark] .btn.b{background:var(--acc2);border-color:var(--acc2);color:#0f0f26}
.btn.g.in,.btn.sec.in{background:var(--chip);border-color:var(--chip);color:var(--ink)}
.btn.sec{border:1.5px solid var(--ink);color:var(--ink);background:transparent}
.btn.w{background:#1faa59;border-color:#1faa59;color:#fff}
.btn.sm{min-height:40px;font-size:13.5px;padding:6px 12px;border-radius:10px}
.dsum{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:12px 0 2px}
.dsum .i{width:19px;height:19px;color:var(--acc)}
.promo,.warn{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-line);font-size:14px;font-weight:550;line-height:1.45;color:var(--ink);display:flex;gap:9px;align-items:flex-start}
.promo .i,.warn .i{width:18px;height:18px;color:var(--gold-ink);margin-top:1px}
.desc{font-size:14.5px;line-height:1.55;margin:8px 0;max-width:65ch}
.tags{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0;font-size:13.5px;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px}
/* passo a passo: o comprimento da barra é a distância do trecho */
.stepsbox{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.stepsbox>b{display:block;font-size:16px;font-weight:850;font-stretch:var(--cond);margin:10px 0 2px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:p}
ol.steps li{counter-increment:p;display:grid;grid-template-columns:26px 1fr;column-gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
ol.steps li:last-child{border-bottom:0}
ol.steps li:before{content:counter(p);font-weight:850;font-stretch:var(--cond);font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;line-height:1.45}
ol.steps .mtr{grid-column:2;display:block;height:4px;margin-top:7px;border-radius:2px;background:var(--chip);overflow:hidden}
ol.steps .mtr i{display:block;height:100%;width:var(--w);background:var(--acc2);border-radius:2px}
[data-theme=dark] ol.steps .mtr i{background:var(--acc2)}
.note{font-size:13px;color:var(--mut);line-height:1.5;margin-top:12px}.note a{color:var(--acc);font-weight:750;text-underline-offset:3px}
.empty{font-size:14.5px;color:var(--mut);padding:14px 0;line-height:1.55}
.empty b{color:var(--ink)}
.intro{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:4px;background:var(--panel2)}
.intro b{font-weight:850;font-stretch:var(--cond);font-size:16px}
.intro ol{margin:6px 0 10px;padding-left:20px;font-size:14.5px;line-height:1.55}
/* minha lista */
.stop{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.num{width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--acc-ink);font-weight:850;display:grid;place-items:center;flex:none;font-size:15px;font-stretch:var(--cond)}
.stop .mid{flex:1;min-width:0;cursor:pointer}
.stop .n{font-weight:750;font-size:15px;line-height:1.25;overflow-wrap:anywhere}.stop .l{font-size:13px;color:var(--mut);line-height:1.35;margin-top:2px}
.mini{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0;color:var(--ink);display:grid;place-items:center}.mini:disabled{opacity:.35}
.mini .i{width:16px;height:16px}
details.sp{margin:0 0 4px 40px}details.sp summary{font-size:13.5px;font-weight:750;color:var(--acc);cursor:pointer;padding:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gpsrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.gpsrow .mid{flex:1;min-width:0}.gpsrow .n{font-weight:750}.gpsrow .l{font-size:13px;color:var(--mut)}
/* barra inferior */
footer#bar{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex:none}
#bar button{flex:1;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--mut);position:relative;transition:color .15s}
#bar button:hover{color:var(--ink)}
#bar button.on{color:var(--acc)}
#bar button.on:before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;background:var(--acc)}
#bd{position:absolute;top:4px;left:calc(50% + 7px);background:var(--acc);color:var(--acc-ink);border-radius:999px;font-size:11px;font-weight:800;padding:1px 6px;display:none}
.gi{width:1em;height:1em;vertical-align:-.14em;flex:none}
/* ---------- mapa: marcadores, legenda de catálogo e níveis de zoom ---------- */
.pin{transform:scale(var(--ps,1))}
.tint{opacity:.07}
.clu{display:none}#map.zf .clu{display:block}
.mk .cm,.mk .pl{opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
#map.zm .mk .cm{opacity:1;visibility:visible}
#map.zn2 .mk .pl{opacity:1;visibility:visible}
#map.zn2 .mk.co .pl{opacity:0;visibility:hidden}
#map.zn2 .mk.co .cm{opacity:1;visibility:visible}
#map .mk.hid .cm,#map .mk.hid .pl{opacity:0!important;visibility:hidden!important}
#map.zn2 .mk.sel .pl{opacity:0;visibility:hidden}#map.zn2 .mk.sel .cm{opacity:1;visibility:visible}
#map.zm g .zi,#map.zn2 g .zi,#map.zn2 g .zl,#map.zn2 g .zn{display:none}
#map .mk .pin,#map .clu .pin{transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .18s}
#map .mk .pin{transform-origin:0 0}

<script>
"use strict";
const {BUILD,BORDER,FLOORS,SEGS,SEGCOLOR,esc} = MM;
const $ = id => document.getElementById(id);
let STORES = [], G = {}, INFO = {src:"embutido",date:""};
const st = {g:null,q:"",seg:null,sel:null,me:null,marking:false,gps:null,gpsB:null,gpsMsg:"",auto:false,
  view:"home",back:"home",sheet:"mid",card:false,fac:null,v3:false,rot:-30,list:[],manual:false,okey:"",more:60};
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };

st.v3 = lsGet("mm_v3",false); st.rot = lsGet("mm_rot",-30); st.list = lsGet("mm_list",[]); st.manual = lsGet("mm_manual",false);
let match = () => true;
const filtering = () => !!(st.seg || st.q.trim());

/* ---------- utilidades ---------- */
const fromPos = () => st.me && G[st.me.g] ? st.me : null;
const curRef = () => { const m=fromPos(); if(m) return {g:m.g,x:m.x,y:m.y}; const g=G[st.g]; return {g:g.key,x:g.entry.x,y:g.entry.y}; };
const refLabel = () => fromPos() ? "sua posição" : `entrada do ${BUILD[G[st.g].b].short} (${FLOORS[st.g.split("|")[1]].split(" ·")[0]})`;
const mTxt = m => m==null||!isFinite(m)?"":`~${Math.max(5,Math.round(m/5)*5)} m`;
const minTxt = m => `${Math.max(1,Math.round(m/70))} min a pé`;
const tint = s => (SEGCOLOR[s.prim]||"#999")+"22";
const locTxt = s => `${BUILD[s.b].short} · ${FLOORS[s.f].split(" ·")[0]} · ${esc(s.cor)}${s.num?` · ${esc(s.num)}`:""}`;
/* ---------- vocabulário do catálogo: ícones desenhados, REF, cartela e passos medidos ---------- */
const ICONS={plus:"M12 5v14M5 12h14",check:"M5 12.5l4.5 4.5L19 7",x:"M6 6l12 12M18 6L6 18",search:"M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4",
  pin:"M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11zM12 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z",
  walk:"M13.5 5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM10 21l2-6 2.5 2.5V21M12 15l1-5.5-3 1.5-1.5 3M13 9.5l2.5 2.5 2.5 1",
  compass:"M12 21a9 9 0 100-18 9 9 0 000 18zM15.5 8.5l-2 5-5 2 2-5z",
  route:"M6 20a2 2 0 100-4 2 2 0 000 4zM18 8a2 2 0 100-4 2 2 0 000 4zM6 16V10a3 3 0 013-3h3M18 8v6a3 3 0 01-3 3h-3",
  tag:"M3 12V4h8l10 10-8 8zM7.5 8.5h.01",key:"M15 13a4 4 0 100-8 4 4 0 000 8zM12.2 11.8L4 20M7 17l2.5 2.5",
  alert:"M12 4l9 16H3zM12 10v4M12 17h.01",share:"M4 12v7h16v-7M12 3v12M7 8l5-5 5 5",ext:"M14 4h6v6M20 4l-9 9M18 14v6H4V6h6",
  up:"M6 15l6-6 6 6",down:"M6 9l6 6 6-6",back:"M15 6l-6 6 6 6",bolt:"M13 3L5 14h6l-1 7 8-11h-6z",
  trash:"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3",map:"M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14",
  gps:"M12 19a7 7 0 100-14 7 7 0 000 14zM12 14a2 2 0 100-4 2 2 0 000 4zM12 2v3M12 19v3M2 12h3M19 12h3",
  wc:"M7 6a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM17 6a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM5.5 21v-6H4l1.5-7h3L10 15H8.5v6M15 21V8h4v7h-1v6M12 3v18",
  star:"M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z",caixa:"M3 7h18v10H3zM12 14.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM6.5 10v4M17.5 10v4",estac:"M5 3h14v18H5zM10 17V7h3a3 3 0 010 6h-3"};
const ic = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[k]||ICONS.pin}"/></svg>`;
/* REF = número do box (o primeiro, quando a loja ocupa vários); sem número, o andar */
const refOf = s => MM.refOf(s);
const refHTML = (s,lg) => `<span class="ref${lg?" lg":""}" aria-label="Referência ${esc(refOf(s))}, ${esc(s.cor)}${s.num?", box "+esc(s.num):""}"><b>${esc(refOf(s))}</b></span>`;
const segLine = s => `<span style="display:inline-flex;gap:5px;align-items:center"><i class="sw" style="--c:${SEGCOLOR[s.prim]||"#999"}"></i>${esc(s.prim)}</span>`;
function stepsHTML(steps){
  const ms=steps.map(t=>{ const m=/~(\d+)\s*m\b/.exec(String(t).replace(/<[^>]+>/g,"")); return m?+m[1]:0; }), mx=Math.max(1,...ms);
  return `<ol class="steps">${steps.map((t,i)=>`<li><span>${t}</span>${ms[i]?`<span class="mtr" aria-hidden="true"><i style="--w:${Math.max(4,Math.round(ms[i]/mx*100))}%"></i></span>`:""}</li>`).join("")}</ol>`;
}
let dcache = {S:null,key:"",map:null};
function allDist(){
  const r=curRef(), key=r.g+"|"+Math.round(r.x)+"|"+Math.round(r.y);
  if (dcache.S===STORES && dcache.key===key) return dcache.map;
  dcache = {S:STORES,key,map:MM.distMany(G,r,STORES)}; return dcache.map;
}
const listStores = () => st.list.map(sl=>STORES.find(s=>s.s===sl)).filter(Boolean);
function ensureOrder(){
  if (!st.list.length) return [];
  if (!st.manual){
    const r=curRef(), key=r.g+"|"+Math.round(r.x)+"|"+Math.round(r.y)+"|"+st.list.slice().sort().join(",");
    if (st.okey!==key){ const o=MM.orderRoute(G,r,listStores()); st.list=o.map(s=>s.s); st.okey=key; lsSet("mm_list",st.list); }
  }
  return listStores();
}
function planList(){
  const order=ensureOrder(); let cur=fromPos(); const legs=[];
  order.forEach((s,i)=>{ legs.push(MM.leg(G,cur,s,i===0?"De onde você está,":`Saindo de <b>${esc(order[i-1].n)}</b>,`)); cur={g:s.g,x:s.door.x,y:s.door.y}; });
  return legs;
}
function toast(t,ms){ const h=$("hint"); h.textContent=t; h.style.display="block"; clearTimeout(toast.t); if(ms) toast.t=setTimeout(()=>{ if(!st.marking) h.style.display="none"; },ms); }

/* ---------- mapa (2D / 3D) ---------- */
const V = () => MM.proj3(G[st.g], st.rot);
let lodC="";
function lod(vb){
  const w=$("mapwrap").clientWidth||360, ppu=w/vb.w, c=ppu<.4?"zf":ppu<.7?"zm":"zn2", m=$("map");
  const ck=c+(st.v3?" v3":"");
  if(ck!==lodC){ lodC=ck; m.setAttribute("class",ck); }
  m.style.setProperty("--ps",Math.max(1,Math.min(2.8,.8/ppu)).toFixed(2));
  m.style.setProperty("--pls",Math.max(.3,Math.min(1.2,.85/ppu)).toFixed(2)); m.style.setProperty("--lgs",(1/ppu).toFixed(3));
  clearTimeout(lod.t); lod.t=setTimeout(declutter,320);
}
/* anti-colisão: nada se sobrepõe. Prioridade: selecionada, lista, destaque, resto. Tenta a pílula; se bater, vira só o ícone; se ainda bater, some até aproximar mais */
function declutter(){
  const m=$("map"); if(!m||st.v3||(lodC!=="zn2"&&lodC!=="zm")) return;
  const box=$("mapwrap").getBoundingClientRect(), items=[], near=lodC==="zn2";
  m.querySelectorAll(".mk").forEach(mk=>{ mk.classList.remove("co","hid"); const cm=mk.querySelector(".cm circle"); if(!cm) return;
    const c=cm.getBoundingClientRect(), pl=mk.querySelector(".pl rect"), p=pl?pl.getBoundingClientRect():c, s=STORES[+mk.dataset.s];
    const out=r=>r.right<box.left||r.left>box.right||r.bottom<box.top||r.top>box.bottom; if(out(c)&&out(p)) return;
    items.push({mk,c,p,pr:!s?9:(st.sel===s.id?0:st.list.includes(s.s)?1:s.dest?2:s.vaga?3:4)}); });
  items.sort((a,b)=>a.pr-b.pr||a.c.top-b.c.top||a.c.left-b.c.left);
  /* a legenda de catálogo vem primeiro: nenhum rótulo cobre a loja escolhida */
  const placed=[], lgd=m.querySelector(".legenda .lgs"); if(lgd) placed.push(lgd.getBoundingClientRect());
  const hit=a=>placed.some(b=>!(a.right+3<b.left||a.left-3>b.right||a.bottom+2<b.top||a.top-2>b.bottom));
  for(const it of items){
    if(near&&!hit(it.p)){ placed.push(it.p); continue; }
    it.mk.classList.add("co");
    if(!hit(it.c)) placed.push(it.c); else{ it.mk.classList.remove("co"); it.mk.classList.add("hid"); }
  }
}
const pz = MM.panZoom($("map"), $("mapwrap"), {
  view:lod,
  tap(target, p){
    if (st.marking){ markAt(st.v3 ? V().inv(p.x,p.y) : p); return; }
    const cz = target.closest && target.closest("[data-cz]");
    if (cz && !st.v3){ const [x,y]=cz.getAttribute("data-cz").split("|").map(Number); centerOn(x,y,430); return; }
    const el = target.closest && target.closest("[data-id]");
    if (el) selectStore(+el.getAttribute("data-id"), false);
  }
});
function centerOn(x,y,w){ const p = st.v3 ? V().P(x,y,0) : {x,y}; pz.center(p.x,p.y,w); relod(); }
/* depois de mover o mapa por código, recalcula o nível de zoom e o anti-colisão dos rótulos */
function relod(){ try{ lod(pz.vb()); }catch(e){} }
function fit(){ const g=G[st.g]; if(g) pz.fit(st.v3 ? V().bounds : MM.bounds(g), g.plan ? Infinity : undefined); relod(); } /* planta desenhada: mostra o desenho inteiro */
function draw(){
  const g=G[st.g]; if(!g) return;
  let paths=null, badges=[]; const s = st.sel!=null ? STORES[st.sel] : null;
  const fac = st.view==="fac" && st.fac ? st.fac : null;
  if (st.view==="store" && s && !st.card){ const lg=MM.leg(G,fromPos(),s,""); paths = lg.parts.filter(p=>p.g===st.g).map(p=>p.pts); badges=lg.vert.filter(v=>v.g===st.g); }
  else if (fac){ paths = fac.lg.parts.filter(p=>p.g===st.g).map(p=>p.pts); badges=fac.lg.vert.filter(v=>v.g===st.g); }
  else if (st.view==="list" && st.list.length){ paths=[]; planList().forEach(l=>{ l.parts.forEach(p=>{ if(p.g===st.g) paths.push(p.pts); }); (l.vert||[]).forEach(v=>{ if(v.g===st.g) badges.push(v); }); }); }
  const stops={}; ensureOrder().forEach((x,i)=>stops[x.id]=i+1);
  const o={fac:!!fac, filter:filtering()?match:null, sel:st.sel, paths, badges, me:st.me&&st.me.g===st.g?st.me:null, stops:Object.keys(stops).length?stops:null};
  $("map").innerHTML = st.v3 ? MM.draw3d(g,Object.assign(o,{V:V()})) : MM.draw(g,o);
  try{ lod(pz.vb()); }catch(e){}
  clearTimeout(lod.t); lod.t=setTimeout(declutter,320);
}
function fitRoute(){
  const g=G[st.g], pts=[]; let paths=[];
  if(st.view==="store"&&st.sel!=null){ MM.leg(G,fromPos(),STORES[st.sel],"").parts.forEach(p=>{ if(p.g===st.g) paths.push(p.pts); }); }
  else if(st.view==="fac"&&st.fac){ st.fac.lg.parts.forEach(p=>{ if(p.g===st.g) paths.push(p.pts); }); }
  else if(st.view==="list"){ planList().forEach(l=>l.parts.forEach(p=>{ if(p.g===st.g) paths.push(p.pts); })); }
  paths.forEach(a=>a.forEach(p=>pts.push(st.v3?V().P(p.x,p.y,0):p)));
  const m=fromPos(); if(m&&m.g===st.g) pts.push(st.v3?V().P(m.x,m.y,0):m);
  if(!pts.length||!g) return fit();

  const arr=same?null:((MM.leg(G,me,s,"").vert||[]).find(v=>v.g===s.g)||g.entry);
  MM.cam.open({ g, store:s, from: same ? me : arr,
    move(p,key){ st.me={g:key||g.key,x:p.x,y:p.y,how:"cam"}; saveMe(); },
    qr(code,gg){ const r=MM.resolveQR(code,G); if(!r||r.g!==gg.key) return null; MM.track("qr",{ponto:code}); return {x:r.x,y:r.y}; },
    tag(){ return fromList&&idx>=0 ? `Parada ${idx+1}/${order.length}` : ""; },

      return { g:gg, store:n, from: sameG ? {x:prev.door.x,y:prev.door.y} : gg.entry, note: sameG ? "" : `Próxima parada em outro andar/prédio: ${BUILD[n.b].short} · ${FLOORS[n.f].split(" ·")[0]}. Vá até a entrada/escada e siga a seta.` }; },

}

  $("sb").innerHTML=`<div class="card"><div class="pv1">${refHTML(s,true)}<div class="pvm"><h2>${s.dest?'<span class="star" role="img" aria-label="destaque">${ic("star")}</span> ':""}${esc(s.n)}</h2>

    <div class="dsum">${ic("walk")}${mTxt(lg.m)} · ${minTxt(lg.m)}</div>
    <div class="btns"><button class="btn b" id="camb">${ic("compass")}Navegar</button><button class="btn g ${inl?"in":""}" id="addb">${ic(inl?"check":"plus")}${inl?"Na lista":"Adicionar à lista"}</button></div>
    <div class="stepsbox"><b>Passo a passo</b>${stepsHTML(lg.steps)}</div>
    ${lg.warn?`<div class="warn">${ic("alert")}<span>${lg.warn}</span></div>`:""}
    ${s.vaga?`<div class="promo">${ic("key")}<span><b>Box disponível para locação.</b>${s.locacao?" "+esc(s.locacao):""}${leaseLink(s)?`<br><a class="btn sm w" style="margin-top:8px" id="lease" href="${leaseLink(s)}" target="_blank" rel="noopener">Tenho interesse ${ic("ext")}</a>`:""}</span></div>`:""}
    ${s.promo?`<div class="promo">${ic("tag")}<span>${esc(s.promo)}</span></div>`:""}${s.desc?`<div class="desc">${esc(s.desc)}</div>`:""}
    <div class="tags">${s.cats.map(c=>`<span class="tag"><i class="sw" style="--c:${SEGCOLOR[c]||"#999"}"></i>${esc(c)}</span>`).join("")}</div>
    <div class="btns">
      <button class="btn sm" id="share">${ic("share")}Compartilhar</button>
      <button class="btn sm" id="here">${ic("pin")}Estou nesta loja</button>
      ${s.whats?`<a class="btn sm w" id="wa" href="${wa(s.whats)}" target="_blank" rel="noopener">WhatsApp ${ic("ext")}</a>`:""}
      ${s.insta?`<a class="btn sm" href="${esc(ig(s.insta))}" target="_blank" rel="noopener">Instagram ${ic("ext")}</a>`:""}
      ${s.b==="real"?"":`<a class="btn sm" href="https://www.megamoda.com.br/produto/${encodeURIComponent(s.s)}/" target="_blank" rel="noopener">Ver no site ${ic("ext")}</a>`}
      ${B.addr?`<a class="btn sm" href="${gmaps(B.name+", "+B.addr)}" target="_blank" rel="noopener">Chegar ao prédio ${ic("ext")}</a>`:""}</div>
    <div class="note">Endereço oficial: ${esc(s.loc)}</div></div>`;
  $("sb").scrollTop=0;
  $("camb").onclick=()=>openCam(s,false);
  $("addb").onclick=()=>toggleList(s.id);
  $("here").onclick=()=>meAtStore(s.id);
  $("share").onclick=()=>shareStore(s);
  const ls=$("lease"); if(ls) ls.onclick=()=>MM.track("locacao",{loja:s.s});
  const w=$("wa"); if(w) w.onclick=()=>MM.track("whats",{loja:s.s});
  $("back").onclick=backFromStore;
}
function viewList(){
  const order=ensureOrder(), n=order.length;
  $("st").textContent=`Minha lista${n?` (${n})`:""}`; $("sm").textContent=n?"ordenada por andar e corredor":"";
  if(!n){ $("sb").innerHTML=`<div class="empty"><b>Sua lista está vazia.</b><br>Toque em <b>+</b> nas lojas que quer visitar. O app mostra a ordem mais curta, começando pela mais perto de você, e desenha o caminho de uma loja até a outra.<br><br><button class="btn g" id="go">${ic("search")}Escolher lojas</button></div>`; $("go").onclick=()=>{ st.view=filtering()?"results":"home"; refresh(); }; return; }
  const legs=planList(), total=legs.reduce((a,l)=>a+l.m,0);
  $("sb").innerHTML=`<div class="dsum">${ic("walk")}Total ${mTxt(total)} · ${minTxt(total)}</div>
    <div class="note" style="margin:2px 0 4px">Ordem a partir da ${refLabel()}.${st.manual?" Você mudou a ordem.":""}</div>
    <div class="btns"><button class="btn b" id="lcam">${ic("compass")}Navegar pela lista</button><button class="btn sm" id="lopt">${ic("bolt")}Otimizar rota</button><button class="btn sm" id="lclr">${ic("trash")}Limpar</button></div>`
    + order.map((s,i)=>`<div class="stop"><span class="num">${i+1}</span><div class="mid" data-id="${s.id}"><div class="n">${esc(s.n)}</div><div class="l">${s.num?`Box ${esc(s.num)} · `:""}${esc(FLOORS[s.f].split(" ·")[0])} · ${esc(s.cor)} · <span class="mtr">${mTxt(legs[i].m)}</span>${i?" da anterior":""}</div></div>
        <button class="mini" data-mv="${i}|-1" aria-label="Subir" ${i?"":"disabled"}>${ic("up")}</button><button class="mini" data-mv="${i}|1" aria-label="Descer" ${i<n-1?"":"disabled"}>${ic("down")}</button><button class="mini" data-rm="${s.id}" aria-label="Remover">${ic("x")}</button></div>
        <details class="sp"><summary>Como chegar</summary>${stepsHTML(legs[i].steps)}</details>`).join("")
    + (legs[0]&&legs[0].warn?`<div class="warn">${ic("alert")}<span>${legs[0].warn}</span></div>`:"") + `<div class="btns"><button class="btn sm" id="lfit">${ic("map")}Ver no mapa</button></div>`;
  $("lcam").onclick=()=>openCam(order[0],true);
  $("lopt").onclick=()=>{ st.manual=false; lsSet("mm_manual",false); st.okey=""; refresh(); toast("Rota otimizada por andar e corredor",2200); };
  $("lclr").onclick=()=>{ st.list=[]; st.manual=false; lsSet("mm_list",[]); lsSet("mm_manual",false); st.okey=""; refresh(); };
  $("lfit").onclick=()=>{ setSheet("peek"); const f=order.find(s=>s.g===st.g)||order[0]; if(f.g!==st.g) showGroup(f.g,false); fit(); };
}
function viewMe(){
  const m=fromPos(); $("st").textContent="Onde estou"; $("sm").textContent=m?"posição marcada":"";
  const where = m ? `${BUILD[G[m.g].b].name} · ${FLOORS[G[m.g].f]}` : "";
  $("sb").innerHTML=`<div class="card">${m?`<div class="dsum">${ic("pin")}${esc(where)}</div><div class="note" style="margin-top:2px">Marcada ${{mapa:"no mapa",qr:"por QR Code",loja:"em uma loja",cam:"pela câmera",entrada:"na entrada"}[m.how]||""}. As rotas e as distâncias saem daqui.</div>`
      :`<div class="warn">${ic("pin")}<span>Você ainda não marcou onde está. Sem isso, as rotas e as distâncias partem da entrada do andar.</span></div>`}
    <h3>Como dizer ao app onde você está</h3>
    <div class="btns" style="flex-direction:column;align-items:stretch">
      <button class="btn g" id="mk">${ic("pin")}Marcar no mapa</button>
      <div class="note" style="margin:0 0 6px"><b>QR Code:</b> aponte a câmera do celular para a etiqueta fixada no corredor. O app abre já com a sua posição.</div>
      <button class="btn" id="gpsb">${ic("gps")}${st.gps?"Atualizar GPS":"Usar o GPS para achar o prédio"}</button>
      ${m?`<button class="btn sm" id="mclr">Limpar minha posição</button>`:""}
    </div>${st.gpsMsg?`<div class="warn">${ic("gps")}<span>${esc(st.gpsMsg)}</span></div>`:""}${st.gps?gpsInfo():""}</div>${foot()}`;
  $("mk").onclick=()=>{ setMarking(true); }; $("gpsb").onclick=startGPS;
  const c=$("mclr"); if(c) c.onclick=()=>{ st.me=null; saveMe(); refresh(); };
  const cal=$("cal"); if(cal) cal.onclick=calibrate;
}
function gpsInfo(){
  return `<h3>GPS · precisão ±${Math.round(st.gps.acc)} m</h3>${BORDER.map(k=>{ const B=BUILD[k], d=MM.hav(st.gps.lat,st.gps.lng,B.lat,B.lng); return `<div class="gpsrow"><div class="mid"><div class="n">${B.name}</div><div class="l">${d>1000?(d/1000).toFixed(1)+" km":Math.round(d)+" m"} ${B.cal?"(calibrado)":"(coordenada aproximada)"}</div></div>${B.addr?`<a class="btn sm" href="${gmaps(B.name+", "+B.addr)}" target="_blank" rel="noopener">Rota ${ic("ext")}</a>`:""}</div>`; }).join("")}
    <div class="btns"><button class="btn sm" id="cal">${ic("pin")}Estou na entrada do ${BUILD[G[st.g].b].short}</button></div>
    <div class="note">“Estou na entrada” grava o GPS atual como a posição do prédio aberto no mapa, só neste aparelho. O administrador pode gravar para todos no painel.</div>`;
}
function renderSheet(){
  applySheet();
  if (st.view==="fac" && st.fac) return viewFac();
  if (st.view==="store" && st.sel!=null) return st.card ? viewCard() : viewStore();
  if (st.view==="list") return viewList();
  if (st.view==="me") return viewMe();
  if (filtering()) { st.view="results"; return viewResults(); }
  st.view="home"; return viewHome();
}
$("sb").onclick=e=>{
  const a=e.target.closest("[data-add]"); if(a){ e.stopPropagation(); toggleList(+a.dataset.add); return; }
  const mv=e.target.closest("[data-mv]"); if(mv){ const [i,d]=mv.dataset.mv.split("|").map(Number); moveStop(i,d); return; }
  const rm=e.target.closest("[data-rm]"); if(rm){ const s=STORES[+rm.dataset.rm]; const i=st.list.indexOf(s.s); if(i>=0){ st.list.splice(i,1); st.okey=""; lsSet("mm_list",st.list); } markBar(); draw(); renderSheet(); return; }
  const c=e.target.closest("[data-cat]"); if(c){ st.seg=c.dataset.cat; st.sel=null; st.view="results"; st.more=60; refresh(true); $("sb").scrollTop=0; return; }
  const it=e.target.closest("[data-id]"); if(it) selectStore(+it.dataset.id);
};
let qt,tt; $("q").oninput=e=>{ clearTimeout(qt); clearTimeout(tt); const v=e.target.value;
  qt=setTimeout(()=>{ st.q=v; st.sel=null; st.view=filtering()?"results":"home"; st.more=60; if(st.sheet==="peek") setSheet("mid"); refresh(true); $("sb").scrollTop=0; },160);
  tt=setTimeout(()=>{ const t=v.trim(); if(t.length>=2) MM.track("busca",{termo:MM.norm(t),n:STORES.filter(match).length}); },1800); };
function refresh(jump){
  match = MM.matcher(STORES, st.q, st.seg);
  renderFilter(); renderTabs(); renderLoc();
  if (jump && filtering() && !G[st.g].stores.some(match)){ const f=STORES.find(match); if(f) showGroup(f.g,true); }
  draw(); renderSheet(); markBar();
}

/* ---------- GPS ---------- */
try{ const c=lsGet("mm_cal",{}); for(const k in c) if(BUILD[k]) Object.assign(BUILD[k],c[k],{cal:true}); }catch(e){}
function startGPS(silent){
  silent = silent===true;
  if (!silent){ st.view="me"; if(st.sheet==="peek") setSheet("mid"); }
  if (!("geolocation" in navigator)){ st.gpsMsg="Este navegador não tem GPS."; return silent ? null : refresh(); }
  if (st.watch) { if(!silent) renderSheet(); return; }
  st.gpsMsg="Procurando sua localização…"; if(!silent) refresh(); else toast("Procurando em qual prédio você está…",2500);
  try{ st.watch=navigator.geolocation.watchPosition(p=>{
    st.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    let best=null; for(const k of BORDER){ const d=MM.hav(st.gps.lat,st.gps.lng,BUILD[k].lat,BUILD[k].lng); if(!best||d<best.d) best={k,d}; }
    st.gpsB=best; const inside=best.d<120+Math.min(st.gps.acc,80);
    $("gps").classList.add("on");
    st.gpsMsg=inside?`Você está no ${BUILD[best.k].name} (±${Math.round(st.gps.acc)} m).`:`Você está a ${best.d>1000?(best.d/1000).toFixed(1)+" km":Math.round(best.d)+" m"} do ${BUILD[best.k].name}.`;
    if (inside && !st.auto){ st.auto=true; const k=G[best.k+"|T"]?best.k+"|T":Object.keys(G).find(x=>x.startsWith(best.k)); if(k && G[st.g].b!==best.k) showGroup(k,true);
      if(!st.me && k){ const gg=G[k]; st.me={g:k,x:gg.entry.x,y:gg.entry.y,how:"entrada"}; refresh(); initialView(); }
      toast("Você está no "+BUILD[best.k].name,3500); }
    if (st.view==="me") renderSheet();
  }, err=>{ st.watch=null; st.gpsMsg=err.code===1?"A permissão de localização foi negada ou está bloqueada nesta janela. No site publicado (HTTPS), permita o acesso ao local.":"Não foi possível obter o GPS agora."; $("gps").classList.remove("on"); if(st.view==="me") renderSheet(); }, {enableHighAccuracy:true,maximumAge:5000,timeout:20000}); }
  catch(e){ st.gpsMsg="GPS indisponível nesta janela."; refresh(); }
}
$("gps").onclick=startGPS;
function calibrate(){
  const g=G[st.g], k=g.b; Object.assign(BUILD[k],{lat:st.gps.lat,lng:st.gps.lng,cal:true});
  const c=lsGet("mm_cal",{}); c[k]={lat:st.gps.lat,lng:st.gps.lng}; lsSet("mm_cal",c);
  const t=G[k+"|T"]||g; st.me={g:t.key,x:t.entry.x,y:t.entry.y,how:"entrada"}; saveMe(); refresh();
}

/* ---------- tema claro / escuro ---------- */
function applyTheme(t,redraw){
  document.documentElement.dataset.theme=t; MM.dark=(t==="dark"); lsSet("mm_theme",t);
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content="#16163f";
  if(redraw && G[st.g]) draw();
}
MM.dark = document.documentElement.dataset.theme==="dark";
$("th").onclick=()=>applyTheme(MM.dark?"light":"dark",true);

/* ---------- alto contraste (sol forte) ---------- */
function applyHC(on){ document.documentElement.toggleAttribute("data-hc",on); $("hc").classList.toggle("on",on); $("hc").setAttribute("aria-pressed",on); lsSet("mm_hc",on); }
$("hc").onclick=()=>applyHC(!document.documentElement.hasAttribute("data-hc"));
applyHC(!!lsGet("mm_hc",false));

/* ---------- girar o mapa 3D com dois dedos (sem botões na tela) ---------- */
{ const m=$("map"), P=new Map(); let a0=null, acc=0;
  const ang=()=>{ const [a,b]=[...P.values()]; return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI; };
  m.addEventListener("pointerdown",e=>{ P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(P.size===2){ a0=ang(); acc=0; } });
  m.addEventListener("pointermove",e=>{ if(!P.has(e.pointerId)) return; P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size!==2||!st.v3||a0==null) return; let a=ang(), d=a-a0; if(d>180) d-=360; if(d<-180) d+=360; a0=a; acc+=d;
    if(Math.abs(acc)>=28){ rotate(acc>0?30:-30); acc=0; } });
  const up=e=>{ P.delete(e.pointerId); a0=null; acc=0; };
  m.addEventListener("pointerup",up); m.addEventListener("pointercancel",up); }

/* ---------- instalar (PWA) ---------- */
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; $("inst").style.display="grid"; });
$("inst").onclick=async()=>{ if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; $("inst").style.display="none"; };
if ("serviceWorker" in navigator && location.protocol==="https:" && window.top===window) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- início ---------- */
function boot(data){
  const keep = st.sel!=null && STORES[st.sel] ? STORES[st.sel].s : null;
  INFO={src:data.src,date:data.date};
  if (data.layouts && data.layouts.predios) for(const k in data.layouts.predios) if(BUILD[k] && !BUILD[k].cal) Object.assign(BUILD[k],data.layouts.predios[k]);
  const b=MM.build(data.stores,data.layouts); STORES=b.stores; G=b.G;
  if (st.me && !G[st.me.g]) st.me=null;
  st.list=st.list.filter(sl=>STORES.some(s=>s.s===sl)); st.okey="";
  st.sel=null; st.view="home"; st.g = st.me ? st.me.g : (G["shopping|T"]?"shopping|T":MM.groupOrder(G)[0]);
  match=MM.matcher(STORES,st.q,st.seg);
  $("v3").classList.toggle("on",st.v3); $("v3").textContent=st.v3?"2D":"3D"; $("mapwrap").classList.toggle("v3",st.v3);
  showGroup(st.g,false); refresh(); requestAnimationFrame(()=>{ initialView(); applyHash(); applyLink(keep); });
}
/* visão inicial: perto do usuário ou da entrada, já legível (o botão ⤢ mostra o andar inteiro) */
function initialView(){
  const g=G[st.g]; if(!g) return;
  if (filtering()) return fit();
  const m=fromPos(); if (m && m.g===st.g) return centerOn(m.x,m.y,440);
  centerOn(g.entry.x+(g.b==="park"?110:210),g.entry.y+(g.b==="park"?240:150),g.b==="park"?420:500);
}
/* link direto: ?loja=slug  (também aceita o nome, sem acento) */
let linkDone=false;
function applyLink(keep){
  let slug=keep;
  if(!slug && !linkDone){ linkDone=true; try{ slug=new URLSearchParams(location.search).get("loja"); }catch(e){} if(slug) MM.track("link",{loja:String(slug).slice(0,100)}); }
  if(!slug) return;
  const q=MM.slugify(slug), s=STORES.find(x=>x.s===slug)||STORES.find(x=>MM.slugify(x.s)===q)||STORES.find(x=>MM.slugify(x.n)===q);
  if(!s){ if(!keep) toast("Não encontramos essa loja. Use a busca.",3500); return; }
  st.back="home"; selectStore(s.id,true,!!keep); setSheet("mid");
}
window.addEventListener("resize",fit);
/* ao abrir: pede o GPS sozinho para descobrir o prédio (sem o usuário escolher) */
let gpsAsked=false;
function autoGPS(){
  if(gpsAsked) return; gpsAsked=true;
  const go=()=>startGPS(true);
  try{ if(navigator.permissions&&navigator.permissions.query) navigator.permissions.query({name:"geolocation"}).then(q=>{ if(q.state!=="denied") go(); },go); else go(); }catch(e){ go(); }
}
boot({stores:MM.embedded(),layouts:{},src:"embutido",date:window.MM_DATE||""});
setTimeout(autoGPS,600);
MM.load().then(d=>{ if(d.src!=="embutido"||Object.keys(d.layouts).length) boot(d); MM.track("abrir"); });
</script>
